name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import boundaries
        run: npm run check:deps
      - name: Display names live only in the naming file
        run: npm run check:names
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (headless)
        run: npm test
      - name: Build
        run: npm run build
